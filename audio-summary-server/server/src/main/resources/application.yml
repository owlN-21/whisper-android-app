app:
  storage:
    upload-dir: uploads

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: audio-summary-server
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/audio_summary_db
    username: ${USERNAMEDB}
    password: ${PASSWORDDB}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

